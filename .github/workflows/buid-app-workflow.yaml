name: Build
on: [pull_request, push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 17
          cache: gradle
      - name: Check locale strings
        run: python3 scripts/check_locale_strings.py
      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-lint-reports
          path: |
            etsuran/build/reports/tests/
            etsuran/build/reports/lint-results-debug.html
      - name: Build the app
        run: ./gradlew assembleRelease
